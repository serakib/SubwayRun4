[package]
name = "cyber-defender"
version = "1.0.0"
edition = "2021"
description = "Cyber Defender - a browser arcade game written in Rust and WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "KeyboardEvent",
  "MouseEvent",
  "TouchEvent",
  "Touch",
  "Storage",
  "Element",
  "DomRect"
] }
